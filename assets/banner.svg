<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="336" viewBox="0 0 1000 336" role="img" aria-label="Azure Managed Grafana: A Dashboard Nobody Has to Operate">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#431407"/><stop offset="1" stop-color="#c2410c"/></linearGradient><radialGradient id="glow" cx=".85" cy=".5" r=".6"><stop offset="0" stop-color="#a7f3d0" stop-opacity=".28"/><stop offset="1" stop-color="#a7f3d0" stop-opacity="0"/></radialGradient></defs>
<rect width="1000" height="336" rx="18" fill="url(#bg)"/><rect width="1000" height="336" rx="18" fill="url(#glow)"/>
<circle cx="60" cy="40" r="3" fill="#a7f3d0" opacity=".7"><animate attributeName="opacity" values=".2;.9;.2" dur="3s" repeatCount="indefinite"/></circle>
<text x="48" y="64" font-size="14" letter-spacing="3" fill="#a7f3d0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="700">DEVOPS BOOTCAMP · LAB</text>
<text x="48" y="112" font-size="32" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Azure Managed Grafana: A</text>
<text x="48" y="150" font-size="32" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Dashboard Nobody Has to Operate</text>
<text x="48" y="180" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">The owner wants the storage numbers on a screen, without anyone</text>
<text x="48" y="202" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">running another server. Azure Managed Grafana is a Grafana that</text>
<text x="48" y="224" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">Microsoft operates, but a new workspace shows nothing and lets nobody</text>
<text x="48" y="246" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">in until two identities have two roles: you (Grafana Admin) and the…</text>
<rect x="48" y="278" width="122" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#a7f3d0" stroke-opacity=".7"/><text x="62" y="299" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">105-120 min</text>
<rect x="182" y="278" width="767" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#a7f3d0" stroke-opacity=".7"/><text x="196" y="299" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Cost: a few tens of cents if torn down the same day (the workspace is billed per hour)</text>
<g transform="translate(750,68)">
<path d="M12 180 H210 M12 180 V20" stroke="#a7f3d0" stroke-opacity=".6" stroke-width="3" fill="none"/>
